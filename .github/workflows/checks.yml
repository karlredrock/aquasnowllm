name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python27-compatibility:
    name: Python 2.7 syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse everything with the 2.7 grammar
        run: python3 tools/py2_syntax_check.py

  logic:
    name: Offline logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self test
        # the runner's preinstalled python3 is enough; version pinning here
        # made actions/setup-python@v5 fail before the tests even started
        run: python3 --version && python3 aquasnowllm.py --self-test

  tls-and-bridge:
    name: TLS / bridge integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration test (local HTTPS server, no network)
        # annotations are readable through the API even when the raw job log
        # is not, so echo the interesting lines on failure
        run: |
          set +e
          python3 tests/net_test.py 2>&1 | tee /tmp/net.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            head -6 /tmp/net.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep -iE "fail|error|traceback|not ok" /tmp/net.log | head -4 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$code"

  gui:
    name: Headless window test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyQt5 and a headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 \
            libxcb-cursor0 libdbus-1-3
          python3 -m pip install PyQt5
      - name: Run the window
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tools/gui_smoke.py

  bundle:
    name: .app bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the bundle
        run: python3 tools/build_app.py --zip
      - name: Verify the bundle and its zip
        run: python3 tools/app_test.py
      - name: Keep it as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaSnowLLM.app
          path: dist/AquaSnowLLM.app.zip
          if-no-files-found: error

  tkinter-edition:
    name: tkinter edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logic self-test (no window needed)
        run: python3 aquasnow.py --self-test
      - name: Drive the UI against a mock Tk
        run: python3 tools/tk_mock_test.py
      - name: Python 2.7 syntax gate
        run: python3 tools/py2_syntax_check.py aquasnow.py aquasnowllm.py
      - name: Install Tk and open a real window
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Real window smoke test
        run: xvfb-run -a python3 tools/tk_window_smoke.py
