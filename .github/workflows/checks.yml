name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python27-compatibility:
    name: Python 2.7 syntax gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse everything with the 2.7 grammar
        run: python tools/py2_syntax_check.py

  logic:
    name: Offline logic tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Self test
        run: python aquasnowllm.py --self-test

  tls-and-bridge:
    name: TLS / bridge integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Integration test (local HTTPS server, no network)
        run: python tests/net_test.py

  gui:
    name: Headless window test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyQt5 and a headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 \
            libxcb-cursor0 libdbus-1-3
          python -m pip install PyQt5
      - name: Run the window
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/gui_smoke.py
